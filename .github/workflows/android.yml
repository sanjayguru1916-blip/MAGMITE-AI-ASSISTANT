name: MAGMITE APK

on: [workflow_dispatch]

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4

  - name: Extract project
    run: unzip -o MAGMITE-AI-Voice-Reply-Fixed.zip -d project

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Build APK
    run: |
      PROJECT=$(find project -name settings.gradle.kts | head -1)
      cd "$(dirname "$PROJECT")"
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MAGMITE-APK
      path: project/**/app/build/outputs/apk/debug/*.apk
