name: Build MAGMITE APK

on:
 workflow_dispatch:

permissions:
 contents: read

jobs:
 build:
  runs-on: ubuntu-latest

 steps:
   - name: Checkout repository
     uses: actions/checkout@v4

   - name: Extract project
     run: unzip -o "MAGMITE-AI-Voice-Reply-Fixed.zip" -d project

   - name: Set up Java
     uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "17"

   - name: Build APK
     run: |
      PROJECT_FILE=$(find project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
      PROJECT_DIR=$(dirname "$PROJECT_FILE")
      echo "Building from $PROJECT_DIR"
      cd "$PROJECT_DIR"
      gradle assembleDebug --no-daemon

   - - name: Upload APK
  uses: actions/upload-artifact@v4
  with:
  name: MAGMITE-APK
  path: project/**/app/build/outputs/apk/debug/*.apk
