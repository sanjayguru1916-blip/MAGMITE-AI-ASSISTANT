name: Build MAGMITE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | head -100

      - name: Extract MAGMITE project
        run: unzip -o "MAGMITE-AI-Floating-HUD-Premium-Updated.zip" -d project

      - name: Find Android project
        run: |
          echo "=== Searching for settings.gradle files ==="
          find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f -name "settings.gradle.kts" | head -n 1)")
          echo "Building project from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAGMITE-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
