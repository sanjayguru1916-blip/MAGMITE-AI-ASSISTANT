name: MAGMITE APK

on: [workflow_dispatch]

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4

  - name: Extract project
    run: unzip -o MAGMITE-AI-Voice-Reply-Fixed.zip -d project

  - name: Check extracted files
    run: |
      echo "=== PROJECT FILES ==="
      find project -maxdepth 4 -type f | head -100

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build APK
    run: |
      cd "$(dirname "$(find project -type f -name settings.gradle.kts -print -quit)")"
      gradle assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MAGMITE-APK
      path: project/**/app/build/outputs/apk/debug/*.apk
